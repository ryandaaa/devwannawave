name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS – universal binary (Intel + Apple Silicon) + merge macOS-specific config
          - platform: macos-latest
            args: >-
              --target universal-apple-darwin
              --config src-tauri/tauri.macos.conf.json
            artifact-name: devwannawave-macos-universal

          # Linux – AppImage + .deb, merge Linux-specific config
          - platform: ubuntu-22.04
            args: --config src-tauri/tauri.linux.conf.json
            artifact-name: devwannawave-linux

          # Windows – NSIS + MSI
          - platform: windows-latest
            args: ''
            artifact-name: devwannawave-windows

    runs-on: ${{ matrix.platform }}

    steps:
      # ── Source ───────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Bun ──────────────────────────────────────────────────────────────────
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ── Rust ─────────────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS needs both targets for the universal binary
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── Linux system dependencies ─────────────────────────────────────────────
      - name: Install system dependencies (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            pkg-config

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: bun install

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Use bun instead of npm to invoke the Tauri CLI
          tauriScript: bunx tauri
          # Create a GitHub Release only when pushing a version tag (v*)
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && 'devwannawave v__VERSION__' || '' }}
          releaseBody: |
            ## devwannawave v__VERSION__

            ### Downloads
            | Platform | File |
            |----------|------|
            | 🪟 Windows | `.msi` (MSI installer) · `.exe` (NSIS installer) |
            | 🍎 macOS   | `.dmg` (Universal — Intel + Apple Silicon) |
            | 🐧 Linux   | `.AppImage` (portable) · `.deb` (Debian/Ubuntu) |

            > **Tip:** You can also grab any build (including non-tagged commits)
            > directly from the **Actions** tab → select a run → **Artifacts** section.
          # Draft so you can review before publishing; set to false for auto-publish
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          prerelease: false
          args: ${{ matrix.args }}

      # ── Upload artifacts ──────────────────────────────────────────────────────
      # Always uploaded (branch pushes, PRs, tags) – downloadable from the
      # Actions run page without needing a tagged release.

      - name: Upload artifacts – Windows
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload artifacts – macOS
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload artifacts – Linux
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
